# ModSecurity - Mitigacao adicional para vetor PHP2Shell
# CVE-2026-109619 e CVE-2026-115560 (caminho session upload progress)
# IMPORTANTE: NÃO corrige as CVEs, atualize o PHP
# NÃO cobre o caminho de falta de memoria (OOM) da CVE-2026-109618
# Funciona com ModSecurity compativel em Apache e Nginx + libModSecurity v3
# Troque os IDs 1005001-1005005 por IDs unicos no seu ambiente
# Caso session.upload_progress.name tenha sido alterado, ajuste o parametro
# Se SecRequestBodyAccess/SecRequestBodyLimitAction ja estiverem definidos
# globalmente, nao precisa repetir
# Se o modsecurity.conf-recommended ja estiver carregado (IDs 200002/200003),
# as regras 1005002 e 1005003 sao redundantes e podem ser removidas

SecRequestBodyAccess On

# Sem isso, com ProcessPartial, o conteudo apos o limite nao e inspecionado
# e o campo pode ser escondido depois de um preenchimento (padding)
SecRequestBodyLimitAction Reject

# phase:2 -> avalia parametros no corpo da requisicao
# ARGS_NAMES -> nomes de parametros, nao os respectivos valores
# @streq -> correspondencia exata (sensivel a maiusculas/minusculas, como o PHP)
# deny,status:403 -> interrompe e retorna HTTP 403
# log -> registra o bloqueio para auditoria
SecRule ARGS_NAMES "@streq PHP_SESSION_UPLOAD_PROGRESS" \
    "id:1005001,phase:2,t:none,deny,status:403,log,\
    msg:'PHP2Shell: parametro PHP_SESSION_UPLOAD_PROGRESS bloqueado',\
    severity:'CRITICAL',\
    tag:'PHP2Shell',tag:'CVE-2026-109619',tag:'CVE-2026-115560'"

# Corpo que o ModSecurity nao conseguiu processar: ARGS_NAMES ficaria vazio
# e a regra acima seria contornada, enquanto o PHP ainda pode aceitar o corpo
SecRule REQBODY_ERROR "!@eq 0" \
    "id:1005002,phase:2,t:none,deny,status:400,log,\
    msg:'PHP2Shell: corpo da requisicao nao processado: %{REQBODY_ERROR_MSG}',\
    severity:'CRITICAL',\
    tag:'PHP2Shell',tag:'CVE-2026-109619',tag:'CVE-2026-115560'"

# Multipart malformado (aspas, cabecalhos, boundary): diferencas de
# interpretacao entre ModSecurity e PHP. Pode gerar falsos positivos com
# clientes antigos; valide primeiro em DetectionOnly
SecRule MULTIPART_STRICT_ERROR "!@eq 0" \
    "id:1005003,phase:2,t:none,deny,status:400,log,\
    msg:'PHP2Shell: multipart malformado ou ambiguo',\
    severity:'CRITICAL',\
    tag:'PHP2Shell',tag:'CVE-2026-109619',tag:'CVE-2026-115560'"

# Content-Type multipart que nao passou pelo parser multipart do ModSecurity
SecRule REQUEST_HEADERS:Content-Type "@rx (?i)multipart/form-data" \
    "id:1005004,phase:2,t:none,deny,status:403,log,\
    msg:'PHP2Shell: multipart nao inspecionado pelo WAF',\
    severity:'CRITICAL',\
    tag:'PHP2Shell',tag:'CVE-2026-109619',tag:'CVE-2026-115560',chain"
    SecRule REQBODY_PROCESSOR "!@streq MULTIPART" "t:none"

# Segunda checagem nos cabecalhos crus de cada parte do multipart
# Requer ModSecurity 2.9.6+ ou libModSecurity 3.0.8+
SecRule MULTIPART_PART_HEADERS "@rx (?i)\bname\s*=\s*[\"']?PHP_SESSION_UPLOAD_PROGRESS\b" \
    "id:1005005,phase:2,t:none,deny,status:403,log,\
    msg:'PHP2Shell: PHP_SESSION_UPLOAD_PROGRESS em cabecalho multipart',\
    severity:'CRITICAL',\
    tag:'PHP2Shell',tag:'CVE-2026-109619',tag:'CVE-2026-115560'"
